apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: connector-name
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  class: io.debezium.connector.postgresql.YugabyteDBConnector
  tasksMax: 1
  config:
    database.hostname: yb-tservers.yb-dev.svc.cluster.local
    database.port: 5433

    plugin.name: yboutput
    publication.autocreate.mode: filtered

    snapshot.mode: never

    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: 'false'

    transforms: pgcompat,outbox
    transforms.pgcompat.type: io.debezium.connector.postgresql.transforms.yugabytedb.PGCompatible
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.fields.additional.placement: type:header:eventType

    value.converter: io.debezium.converters.BinaryDataConverter
    value.converter.delegate.converter.type: org.apache.kafka.connect.json.JsonConverter
    value.converter.delegate.converter.type.schemas.enable: 'false'
